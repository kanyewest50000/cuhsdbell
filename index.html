<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Leigh High School Bell Clock</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155;
    --text:#f1f5f9; --dim:#94a3b8; --accent:#38bdf8;
    --banner:#38bdf8; --banner-text:#082f49;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; padding:0 0 40px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  /* Day-type banner */
  #banner{
    background:var(--banner); color:var(--banner-text);
    text-align:center; padding:14px 16px;
    font-size:1.15rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  }
  #banner small{display:block;font-size:.72rem;font-weight:700;opacity:.75;letter-spacing:.08em;margin-top:3px}

  /* Clock */
  #clock{
    text-align:center; font-variant-numeric:tabular-nums;
    font-size:2.1rem; font-weight:300; letter-spacing:.02em;
    margin:22px 0 4px;
  }
  #date{text-align:center;color:var(--dim);font-size:.85rem;margin-bottom:22px}

  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:20px; margin-bottom:14px;
  }
  .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);font-weight:700}
  #nowName{font-size:1.6rem;font-weight:700;margin:6px 0 2px}
  #nowRange{color:var(--dim);font-size:.85rem}
  #left{
    font-size:3.2rem;font-weight:700;font-variant-numeric:tabular-nums;
    line-height:1.1;margin:14px 0 2px;color:var(--accent);
  }
  #leftLabel{color:var(--dim);font-size:.85rem}

  #bar{height:7px;background:#0b1220;border-radius:99px;overflow:hidden;margin-top:16px}
  #barFill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s linear}

  #nextName{font-size:1.15rem;font-weight:600;margin:6px 0 2px}
  #nextRange{color:var(--dim);font-size:.85rem}

  h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);
     font-weight:700;margin:24px 0 10px;padding-left:4px}
  ol{list-style:none}
  li{
    display:flex;justify-content:space-between;gap:12px;align-items:baseline;
    padding:11px 14px;border-radius:10px;font-size:.95rem;
  }
  li+li{margin-top:2px}
  li .t{color:var(--dim);font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  li.done{opacity:.38}
  li.now{background:var(--accent);color:#082f49;font-weight:700}
  li.now .t{color:#082f49;opacity:.8}
  li.brk{font-style:italic}

  footer{text-align:center;color:var(--dim);font-size:.72rem;margin-top:26px;line-height:1.6}
</style>
</head>
<body>

<div id="banner">—</div>

<div class="wrap">
  <div id="clock">—</div>
  <div id="date">—</div>

  <div class="card">
    <div class="label">Right now</div>
    <div id="nowName">—</div>
    <div id="nowRange"></div>
    <div id="left">—</div>
    <div id="leftLabel"></div>
    <div id="bar"><div id="barFill"></div></div>
  </div>

  <div class="card">
    <div class="label">Up next</div>
    <div id="nextName">—</div>
    <div id="nextRange"></div>
  </div>

  <h2 id="listHead">Today's schedule</h2>
  <ol id="list"></ol>

  <footer>
    Leigh High School &middot; 2026&ndash;2027<br>
    Uses this device's clock. A days = periods 1, 2, 3, 7 &middot; B days = periods 4, 5, 6, 7.
  </footer>
</div>

<script>
/* ---------- A/B calendar, straight from the 2026-27 A/B Calendar PDF ----------
   A  = A day (regular block)      B  = B day (regular block)
   Ac / Bc = collaboration day     Am / Bm = minimum day
   Ar = rally day (regular block)  F1/F2/F3 = finals day 1/2/3
   N  = no school / holiday        (any date not listed = weekend / break)     */
const CAL = {
  "2026-08": {"03":"N", "04":"N", "05":"N", "06":"N", "07":"N", "10":"N", "11":"A", "12":"B", "13":"A", "14":"B", "17":"A", "18":"B", "19":"Ac", "20":"Bc", "21":"Ar", "24":"B", "25":"A", "26":"B", "27":"A", "28":"B", "31":"A"},
  "2026-09": {"01":"B", "02":"A", "03":"B", "04":"A", "07":"N", "08":"B", "09":"Ac", "10":"Bc", "11":"A", "14":"B", "15":"A", "16":"B", "17":"Am", "18":"Bm", "21":"A", "22":"B", "23":"A", "24":"B", "25":"A", "28":"B", "29":"A", "30":"B"},
  "2026-10": {"01":"A", "02":"B", "05":"A", "06":"B", "07":"Ac", "08":"Bc", "09":"N", "12":"N", "13":"A", "14":"B", "15":"A", "16":"B", "19":"A", "20":"B", "21":"A", "22":"B", "23":"A", "26":"B", "27":"A", "28":"B", "29":"Am", "30":"Bm"},
  "2026-11": {"02":"A", "03":"B", "04":"Ac", "05":"Bc", "06":"A", "09":"B", "10":"A", "11":"N", "12":"B", "13":"A", "16":"B", "17":"A", "18":"B", "19":"A", "20":"B", "23":"N", "24":"N", "25":"N", "26":"N", "27":"N", "30":"A"},
  "2026-12": {"01":"B", "02":"Ac", "03":"Bc", "04":"A", "07":"B", "08":"A", "09":"B", "10":"A", "11":"B", "14":"A", "15":"B", "16":"F1", "17":"F2", "18":"F3", "21":"N", "22":"N", "23":"N", "24":"N", "25":"N", "28":"N", "29":"N", "30":"N", "31":"N"},
  "2027-01": {"01":"N", "04":"A", "05":"B", "06":"Ac", "07":"Bc", "08":"A", "11":"B", "12":"A", "13":"B", "14":"A", "15":"B", "18":"N", "19":"A", "20":"B", "21":"A", "22":"B", "25":"A", "26":"B", "27":"N", "28":"A", "29":"B"},
  "2027-02": {"01":"A", "02":"B", "03":"Ac", "04":"Bc", "05":"A", "08":"B", "09":"A", "10":"B", "11":"Am", "12":"Bm", "15":"N", "16":"N", "17":"N", "18":"N", "19":"N", "22":"A", "23":"B", "24":"A", "25":"B", "26":"A"},
  "2027-03": {"01":"B", "02":"A", "03":"B", "04":"A", "05":"B", "08":"N", "09":"A", "10":"B", "11":"A", "12":"B", "15":"A", "16":"B", "17":"Ac", "18":"Bc", "19":"A", "22":"B", "23":"A", "24":"B", "25":"A", "26":"B", "29":"A", "30":"B", "31":"Ac"},
  "2027-04": {"01":"Bc", "02":"A", "05":"B", "06":"A", "07":"B", "08":"Am", "09":"Bm", "12":"N", "13":"N", "14":"N", "15":"N", "16":"N", "19":"A", "20":"B", "21":"Ac", "22":"Bc", "23":"A", "26":"B", "27":"A", "28":"B", "29":"A", "30":"B"},
  "2027-05": {"03":"A", "04":"B", "05":"A", "06":"B", "07":"A", "10":"B", "11":"A", "12":"B", "13":"A", "14":"B", "17":"A", "18":"B", "19":"Ac", "20":"Bc", "21":"A", "24":"B", "25":"A", "26":"B", "27":"A", "28":"B", "31":"N"},
  "2027-06": {"01":"F1", "02":"F2", "03":"F3"}
};

/* ---------- Bell schedules, from the Leigh High School Bell Schedules page ----------
   [start minutes after midnight, end, name, isBreak]
   "P" in a name is replaced with the real period number for an A or B day.   */
const BLOCKS = {
  regular: [
    [510, 595, "Period P1", 0],   // 8:30 - 9:55
    [595, 610, "Brunch",    1],
    [610, 645, "Tutorial",  1],
    [645, 655, "Passing",   1],
    [655, 740, "Period P2", 0],   // 10:55 - 12:20
    [740, 770, "Lunch",     1],
    [770, 780, "Passing",   1],
    [780, 865, "Period P3", 0],   // 1:00 - 2:25
    [865, 875, "Passing",   1],
    [875, 930, "Period 7",  0]    // 2:35 - 3:30
  ],
  collab: [
    [510, 580, "Period P1", 0],   // 8:30 - 9:40
    [580, 595, "Brunch",    1],
    [595, 625, "Tutorial",  1],
    [625, 635, "Passing",   1],
    [635, 705, "Period P2", 0],   // 10:35 - 11:45
    [705, 735, "Lunch",     1],
    [735, 745, "Passing",   1],
    [745, 815, "Period P3", 0]    // 12:25 - 1:35  (no 7th period)
  ],
  minimum: [
    [510, 570, "Period P1", 0],   // 8:30 - 9:30
    [570, 585, "Brunch",    1],
    [585, 615, "Tutorial",  1],
    [615, 625, "Passing",   1],
    [625, 685, "Period P2", 0],   // 10:25 - 11:25
    [685, 695, "Passing",   1],
    [695, 755, "Period P3", 0]    // 11:35 - 12:35  (no 7th period)
  ]
};
/* Finals: day 1 = periods 1 & 2, day 2 = periods 4 & 3, day 3 = periods 5 & 6 */
const FINALS = {
  F1: ["Period 1", "Period 2"],
  F2: ["Period 4", "Period 3"],
  F3: ["Period 5", "Period 6"]
};
function finalsBlocks(code){
  const p = FINALS[code];
  return [
    [510, 630, p[0], 0],          // 8:30 - 10:30
    [630, 645, "Break",  1],
    [645, 765, p[1], 0]           // 10:45 - 12:45
  ];
}

const DAY_TITLE = {
  regular: "Normal Day",
  collab:  "Collaboration Day",
  minimum: "Minimum Day",
  rally:   "Rally Day",
  finals:  "Finals Day"
};
const DAY_COLOR = {
  regular: ["#38bdf8", "#082f49"],
  collab:  ["#fbbf24", "#432004"],
  minimum: ["#a78bfa", "#2e1065"],
  rally:   ["#fb7185", "#4c0519"],
  finals:  ["#f87171", "#450a0a"],
  none:    ["#64748b", "#f8fafc"]
};

function pad(n){ return n < 10 ? "0" + n : "" + n; }

/* Look up what kind of day a given Date is. */
function dayInfo(d){
  const key = d.getFullYear() + "-" + pad(d.getMonth() + 1);
  const code = (CAL[key] || {})[pad(d.getDate())];

  if (!code || code === "N"){
    const weekend = d.getDay() === 0 || d.getDay() === 6;
    return { kind:"none", label: weekend ? "No School" : "No School", sub: weekend ? "Weekend" : "Holiday / break", blocks: [] };
  }
  if (code[0] === "F"){
    return { kind:"finals", label: DAY_TITLE.finals, sub: "Finals day " + code[1] + " · early release",
             blocks: finalsBlocks(code) };
  }

  const letter = code[0];                       // "A" or "B"
  const flag   = code.slice(1);                 // "", "c", "m", "r"
  const kind   = flag === "c" ? "collab" : flag === "m" ? "minimum" : flag === "r" ? "rally" : "regular";
  const table  = kind === "collab" ? "collab" : kind === "minimum" ? "minimum" : "regular";

  // A day runs periods 1/2/3 (+7); B day runs 4/5/6 (+7).
  const nums = letter === "A" ? ["1","2","3"] : ["4","5","6"];
  const blocks = BLOCKS[table].map(function(b){
    return [b[0], b[1], b[2].replace(/P([123])/, function(_, i){ return nums[i - 1]; }), b[3]];
  });

  let sub = letter + " Day · periods " + nums.join(", ") +
            (table === "regular" ? ", 7" : " · no 7th period");
  if (kind === "rally") sub = letter + " Day · rally schedule — check school announcements";

  return { kind: kind, label: DAY_TITLE[kind], sub: sub, blocks: blocks };
}

/* First day, scanning forward, that actually has classes. */
function nextSchoolDay(from){
  const d = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  for (let i = 0; i < 120; i++){
    d.setDate(d.getDate() + 1);
    const info = dayInfo(d);
    if (info.blocks.length) return { date: new Date(d), info: info };
  }
  return null;
}

function fmtClock(mins){
  let h = Math.floor(mins / 60), m = mins % 60;
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12; if (h === 0) h = 12;
  return h + ":" + pad(m) + " " + ampm;
}
function fmtLeft(sec){
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h > 0 ? h + ":" + pad(m) : m) + ":" + pad(s);
}

let renderedFor = "";

function tick(){
  const now  = new Date();
  const info = dayInfo(now);
  const mins = now.getHours() * 60 + now.getMinutes();
  const secs = mins * 60 + now.getSeconds();

  // Banner + colors
  const c = DAY_COLOR[info.kind];
  document.documentElement.style.setProperty("--banner", c[0]);
  document.documentElement.style.setProperty("--banner-text", c[1]);
  document.documentElement.style.setProperty("--accent", info.kind === "none" ? "#64748b" : c[0]);
  document.getElementById("banner").innerHTML =
    info.label + "<small>" + info.sub + "</small>";

  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
  document.getElementById("date").textContent =
    now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });

  const blocks = info.blocks;
  const nowName  = document.getElementById("nowName");
  const nowRange = document.getElementById("nowRange");
  const left     = document.getElementById("left");
  const leftLbl  = document.getElementById("leftLabel");
  const nextName = document.getElementById("nextName");
  const nextRange= document.getElementById("nextRange");
  const barFill  = document.getElementById("barFill");

  let current = -1, next = -1, upNext = -1;
  for (let i = 0; i < blocks.length; i++){
    if (secs >= blocks[i][0] * 60 && secs < blocks[i][1] * 60) current = i;
    if (next === -1 && secs < blocks[i][0] * 60) next = i;
    // "Up next" skips passing periods — nobody needs a countdown to a hallway.
    if (upNext === -1 && secs < blocks[i][0] * 60 && blocks[i][2] !== "Passing") upNext = i;
  }

  // The countdown, the progress bar and the schedule list only mean something
  // on a day that has classes.
  const hasSchool = blocks.length > 0;
  left.style.display     = hasSchool ? "" : "none";
  leftLbl.style.display  = hasSchool ? "" : "none";
  document.getElementById("bar").style.display = hasSchool ? "" : "none";
  document.getElementById("listHead").style.display = hasSchool ? "" : "none";

  if (!hasSchool){                                       // no school at all
    nowName.textContent  = "No school today";
    nowRange.textContent = info.sub === "Weekend" ? "Enjoy the weekend." : "Enjoy the day off.";
    const nx = nextSchoolDay(now);
    if (nx){
      nextName.textContent  = nx.info.label;
      nextRange.textContent = nx.date.toLocaleDateString([], { weekday:"long", month:"long", day:"numeric" }) +
                              " · " + nx.info.sub + " · starts " + fmtClock(nx.info.blocks[0][0]);
    } else {
      nextName.textContent  = "Nothing scheduled";
      nextRange.textContent = "";
    }
  } else if (current >= 0){                              // mid-day
    const b = blocks[current];
    nowName.textContent  = b[2];
    nowRange.textContent = fmtClock(b[0]) + " – " + fmtClock(b[1]);
    left.textContent     = fmtLeft(b[1] * 60 - secs);
    leftLbl.textContent  = "left in " + b[2].toLowerCase();
    barFill.style.width  = (100 * (secs - b[0] * 60) / ((b[1] - b[0]) * 60)) + "%";
    if (upNext >= 0){
      nextName.textContent  = blocks[upNext][2];
      nextRange.textContent = fmtClock(blocks[upNext][0]) + " – " + fmtClock(blocks[upNext][1]);
    } else {
      nextName.textContent  = "End of the school day";
      nextRange.textContent = "Dismissal at " + fmtClock(blocks[blocks.length - 1][1]);
    }
  } else if (next >= 0){                                 // before school starts
    nowName.textContent  = "Before school";
    nowRange.textContent = "First bell at " + fmtClock(blocks[0][0]);
    left.textContent     = fmtLeft(blocks[next][0] * 60 - secs);
    leftLbl.textContent  = "until " + blocks[next][2].toLowerCase();
    barFill.style.width  = "0%";
    nextName.textContent  = blocks[upNext][2];
    nextRange.textContent = fmtClock(blocks[upNext][0]) + " – " + fmtClock(blocks[upNext][1]);
  } else {                                               // after dismissal
    nowName.textContent  = "School's out";
    nowRange.textContent = "Dismissed at " + fmtClock(blocks[blocks.length - 1][1]);
    left.textContent     = "—";
    leftLbl.textContent  = "";
    barFill.style.width  = "100%";
    nextName.textContent = "Nothing left today";
    nextRange.textContent= "";
  }

  // Rebuild the schedule list only when the day or the active block changes.
  const stamp = now.toDateString() + "|" + current;
  if (stamp !== renderedFor){
    renderedFor = stamp;
    const list = document.getElementById("list");
    list.innerHTML = "";
    blocks.forEach(function(b, i){
      const li = document.createElement("li");
      if (b[3]) li.className = "brk";
      if (i === current) li.className += " now";
      else if (secs >= b[1] * 60) li.className += " done";
      li.innerHTML = "<span>" + b[2] + "</span><span class='t'>" +
                     fmtClock(b[0]) + " – " + fmtClock(b[1]) + "</span>";
      list.appendChild(li);
    });
  }
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
